<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="edgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dcebff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffdcb4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer Glow -->
  <rect x="60" y="60" width="392" height="392" rx="40" ry="40" 
        style="fill:none;stroke:url(#edgeGradient);stroke-width:15;opacity:0.6;filter:url(#glow)" />
        
  <!-- Main Border -->
  <rect x="60" y="60" width="392" height="392" rx="40" ry="40" 
        style="fill:none;stroke:url(#edgeGradient);stroke-width:15;" />
</svg>
