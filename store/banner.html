<html><head><style>
*{margin:0;box-sizing:border-box}
body{width:1920px;height:640px;overflow:hidden;font-family:"Ubuntu","Inter","Cantarell",sans-serif;
 background:radial-gradient(ellipse at 72% 50%,#2c3146 0%,#161925 55%,#0d0f16 100%);color:#fff;position:relative}
.text{position:absolute;left:150px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:820px}
h1{font-size:92px;font-weight:700;letter-spacing:-2px}
h1 span{background:linear-gradient(90deg,#e4f0ff,#fff 45%,#ffd9a8);-webkit-background-clip:text;color:transparent}
p{font-size:40px;color:#c9cedd;margin-top:22px;line-height:1.3}
.chips{display:flex;gap:14px;margin-top:40px}
.chips div{font-size:24px;padding:10px 22px;border-radius:999px;background:#ffffff14;border:1px solid #ffffff26;color:#e8ebf3}
.monitor{position:absolute;left:1120px;top:95px;width:640px;height:400px;border-radius:22px;background:#0a0b10;padding:14px;
 box-shadow:0 30px 80px #000a}
.screen{position:relative;width:100%;height:100%;border-radius:12px;overflow:hidden;
 background:radial-gradient(ellipse at 50% 70%,#3a3a44 0%,#1c1d25 70%)}
.flood{position:absolute;inset:0;border-radius:12px;
 box-shadow:inset 0 0 0 10px #fffaf2, inset 0 0 70px 30px #fff1dccc, inset 0 0 160px 40px #ffe6c455}
.person{position:absolute;left:50%;transform:translateX(-50%);bottom:0}
.head{width:120px;height:120px;border-radius:50%;margin:0 auto;background:linear-gradient(#fff1dc,#e7c69c)}
.body{width:300px;height:130px;margin-top:18px;border-radius:150px 150px 0 0;background:linear-gradient(#fbe6c8,#d9b588)}
.stand{position:absolute;left:1390px;top:509px;width:100px;height:56px;background:linear-gradient(#1b1d27,#10121a)}
.base{position:absolute;left:1320px;top:562px;width:240px;height:14px;border-radius:8px;background:#1b1d27}
.halo{position:absolute;left:1060px;top:40px;width:760px;height:510px;border-radius:60px;
 background:radial-gradient(ellipse,#ffe9c833 0%,#0000 65%)}
</style></head><body>
<div class="halo"></div>
<div class="text">
  <h1><span>Screen Edge Light</span></h1>
  <p>Look great on every video call.<br>Your screen edges become a soft studio light.</p>
  <div class="chips"><div>Studio presets</div><div>Click-through</div><div>Day / night</div></div>
</div>
<div class="monitor"><div class="screen">
  <div class="person"><div class="head"></div><div class="body"></div></div>
  <div class="flood"></div>
</div></div>
<div class="stand"></div><div class="base"></div>
</body></html>
